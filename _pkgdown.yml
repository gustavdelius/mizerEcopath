url: https://gustavdelius.github.io/mizerEcopath/

navbar:
  structure:
    right: [search, github]

template:
  bootstrap: 5
  math-rendering: mathjax

build:
  articles: true
  lazy: false

reference:
- title: "Shiny gadget"
  desc: >
    Interactive interface for tuning mizer model parameters.
  contents:
  - tuneEcopath
  - tuneParams
  - tuneGrowth
  - tuningGadget
  - has_concept("gadget tabs")
  - has_concept("gadget controls")
- title: "Plotting"
  desc: >
    Basic visualisations
  contents:
  - starts_with("plot")
- title: "Helper functions"
  desc: >
    Internal tools to support calibration and simulation.
  contents:
  - addCatch
  - has_concept("helper")
- title: "Data sets"
  desc: >
    Example input and output objects for illustrating functions.
  contents:
    - has_keyword("datasets")
- title: "Diffusion"
  desc: >
    Functions for solving diffusion equations in mizer models.
  contents:
  - solve_double_sweep
  - project_diffusion
  - solve_diffusion_pde
- title: "Age-at-length"
  desc: >
    Functions for working with age at size.
  contents:
  - calculate_and_aggregate_likelihood
  - generate_model_predictions_for_date
  - getLogLik
  - simulateCohort
  - preprocess_length_at_age
